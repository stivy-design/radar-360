name = "radar-360"
main = "src/index.js"
compatibility_date = "2026-10-15"

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "radar-360-db"
database_id = "2db8a678-0870-4434-952f-d48192da556f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "radar-360-imagens"

# Configure these as Worker secrets; never commit their values:
# npx wrangler secret put ADMIN_PASSWORD_SALT
# npx wrangler secret put ADMIN_PASSWORD_HASH
# npx wrangler secret put SESSION_SECRET

[triggers]
crons = ["*/15 * * * *"]
