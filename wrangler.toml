name = "radar-360"
main = "src/index.js"
compatibility_date = "2026-10-15"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "radar-360-db"
database_id = "SUBSTITUIR_PELO_ID_DO_D1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "radar-360-images"

# Configure the following secrets with Wrangler before enabling the admin:
# npx wrangler secret put ADMIN_PASSWORD_SALT
# npx wrangler secret put ADMIN_PASSWORD_HASH
# npx wrangler secret put SESSION_SECRET
# Never commit secrets to this repository.
